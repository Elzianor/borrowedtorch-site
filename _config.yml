title: Borrowed Torch
description: Borrowed Torch is an independent game studio crafting atmospheric games.
url: https://borrowedtorch.com
baseurl: ""

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# the folders of the Kindling engine's section: its menu under the top menu and its top menu item lit (_data/nav.yml)
defaults:
  - scope:
      path: kindling
    values:
      section: kindling
  - scope:
      path: docs
    values:
      section: kindling

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .idea
