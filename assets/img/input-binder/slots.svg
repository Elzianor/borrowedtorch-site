<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <text x="320" y="20" fill="#e9c27a" font-family="Consolas, ui-monospace, monospace" font-size="12">fire.Bind(1, space, forceMap: true)</text>

  <!-- column titles -->
  <g fill="#8a7a63" font-size="11">
    <text x="20" y="50" text-anchor="start">Before</text>
    <text x="140" y="50">slot 0</text>
    <text x="235" y="50">slot 1</text>
    <text x="340" y="50" text-anchor="start">After</text>
    <text x="460" y="50">slot 0</text>
    <text x="555" y="50">slot 1</text>
  </g>

  <!-- action names -->
  <g fill="#d9cbb4" font-size="13" text-anchor="start">
    <text x="20" y="84">Jump</text>
    <text x="20" y="124">Fire</text>
    <text x="20" y="164">Look</text>
    <text x="340" y="84">Jump</text>
    <text x="340" y="124">Fire</text>
    <text x="340" y="164">Look</text>
  </g>

  <!-- bound slots -->
  <g fill="#15100c" stroke="#e9c27a">
    <rect x="100" y="66" width="80" height="26" rx="6"/>
    <rect x="195" y="66" width="80" height="26" rx="6"/>
    <rect x="100" y="106" width="80" height="26" rx="6"/>
    <rect x="195" y="106" width="80" height="26" rx="6"/>
    <rect x="100" y="146" width="80" height="26" rx="6"/>
    <rect x="515" y="66" width="80" height="26" rx="6"/>
    <rect x="420" y="106" width="80" height="26" rx="6"/>
    <rect x="420" y="146" width="80" height="26" rx="6"/>
  </g>
  <rect x="515" y="106" width="80" height="26" rx="6" fill="#15100c" stroke="#f28c28" stroke-width="1.5"/>

  <!-- empty slots -->
  <g fill="none" stroke="#8a7a63" stroke-opacity=".6" stroke-dasharray="3 3">
    <rect x="195" y="146" width="80" height="26" rx="6"/>
    <rect x="515" y="146" width="80" height="26" rx="6"/>
  </g>
  <rect x="420" y="66" width="80" height="26" rx="6" fill="none" stroke="#f28c28" stroke-opacity=".7" stroke-dasharray="3 3"/>

  <g fill="#d9cbb4">
    <text x="140" y="83">Space</text>
    <text x="235" y="83">W</text>
    <text x="140" y="123">Left mouse</text>
    <text x="235" y="123">Ctrl</text>
    <text x="140" y="163">Movement</text>
    <text x="555" y="83">W</text>
    <text x="460" y="123">Left mouse</text>
    <text x="460" y="163">Movement</text>
  </g>
  <text x="555" y="123" fill="#f28c28">Space</text>
  <g fill="#8a7a63">
    <text x="235" y="163">—</text>
    <text x="555" y="163">—</text>
    <text x="460" y="83" fill="#f28c28" fill-opacity=".8">—</text>
  </g>

  <line x1="290" y1="119" x2="328" y2="119" stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- what happened -->
  <line x1="20" y1="192" x2="620" y2="192" stroke="#8a7a63" stroke-opacity=".4"/>
  <g font-size="11" text-anchor="start">
    <rect x="20" y="204" width="44" height="18" rx="5" fill="#15100c" stroke="#f28c28"/>
    <text x="42" y="217" fill="#f28c28" text-anchor="middle">Space</text>
    <text x="74" y="217" fill="#d9cbb4">taken from Jump's slot 0, which empties: Jump keeps W</text>
    <rect x="20" y="228" width="44" height="18" rx="5" fill="none" stroke="#8a7a63" stroke-dasharray="3 3"/>
    <text x="42" y="241" fill="#8a7a63" text-anchor="middle">Ctrl</text>
    <text x="74" y="241" fill="#d9cbb4">released: it held Fire's slot 1, and is bound to nothing now</text>
  </g>
</svg>
