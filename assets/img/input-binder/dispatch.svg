<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <!-- column titles -->
  <g fill="#8a7a63" font-size="11">
    <text x="115" y="20">polled input, passed to Update</text>
    <text x="335" y="20">its identity, looked up</text>
    <text x="540" y="20">action called</text>
  </g>

  <!-- the polled inputs -->
  <g fill="#15100c" stroke="#e9c27a">
    <rect x="20" y="34" width="190" height="48" rx="8"/>
    <rect x="20" y="110" width="190" height="48" rx="8"/>
    <rect x="20" y="186" width="190" height="48" rx="8"/>
  </g>
  <g fill="#d9cbb4">
    <text x="115" y="54">Space key</text>
    <text x="115" y="130">Pad button A</text>
    <text x="115" y="206">Mouse movement</text>
  </g>
  <g font-family="Consolas, ui-monospace, monospace" font-size="11">
    <text x="115" y="72" fill="#e9c27a">Pressed · player 0</text>
    <text x="115" y="148" fill="#e9c27a">Down · player 1</text>
    <text x="115" y="224" fill="#e9c27a">(4, −2) · player 0</text>
  </g>

  <!-- the identities -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#d9cbb4">
    <text x="335" y="62">Keyboard · Button · 32</text>
    <text x="335" y="138">GamePad · Button · 0</text>
    <text x="335" y="214">Mouse · TwoAxes · 0</text>
  </g>

  <!-- the actions -->
  <g fill="#15100c" stroke="#f28c28">
    <rect x="460" y="40" width="160" height="36" rx="8"/>
    <rect x="460" y="192" width="160" height="36" rx="8"/>
  </g>
  <rect x="460" y="116" width="160" height="36" rx="8" fill="none" stroke="#8a7a63" stroke-opacity=".6" stroke-dasharray="3 3"/>
  <g font-family="Consolas, ui-monospace, monospace" font-size="12">
    <text x="540" y="63" fill="#f28c28">Jump(Pressed, 0)</text>
    <text x="540" y="215" fill="#f28c28">Look((4, −2), 0)</text>
  </g>
  <text x="540" y="139" fill="#8a7a63" font-size="12">bound to nothing: skipped</text>

  <g stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="212" y1="58" x2="252" y2="58"/>
    <line x1="212" y1="134" x2="252" y2="134"/>
    <line x1="212" y1="210" x2="252" y2="210"/>
    <line x1="418" y1="58" x2="456" y2="58"/>
    <line x1="418" y1="210" x2="456" y2="210"/>
  </g>
  <line x1="418" y1="134" x2="456" y2="134" stroke="#8a7a63" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
