<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7a63"/>
    </marker>
  </defs>

  <!-- the two sides of the boundary -->
  <g fill="#8a7a63" text-anchor="start" font-size="11" letter-spacing="1.5">
    <text x="16" y="114">CPU</text>
    <text x="16" y="140">GPU</text>
  </g>
  <line x1="56" y1="125" x2="624" y2="125" stroke="#8a7a63" stroke-dasharray="4 3"/>

  <!-- the CPU side: the settings feed the sheet, the sheet drives the solver -->
  <g fill="#15100c" stroke="#e9c27a">
    <rect x="56" y="22" width="152" height="52" rx="8"/>
    <rect x="248" y="22" width="152" height="52" rx="8"/>
    <rect x="440" y="22" width="168" height="52" rx="8"/>
  </g>
  <g fill="#e9c27a" font-family="Consolas, ui-monospace, monospace">
    <text x="132" y="44">FabricSettings</text>
    <text x="324" y="44">Fabric</text>
    <text x="524" y="44">FabricEffect</text>
  </g>
  <g fill="#8a7a63" font-size="11">
    <text x="132" y="62">every tunable</text>
    <text x="324" y="62">the grid, pins and cuts</text>
    <text x="524" y="62">buffers, clock, dispatches</text>
  </g>
  <g stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="210" y1="48" x2="244" y2="48"/>
    <line x1="402" y1="48" x2="436" y2="48"/>
  </g>

  <!-- the solver dispatches its passes on the GPU -->
  <line x1="524" y1="76" x2="524" y2="162" stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="532" y="108" fill="#8a7a63" font-size="11" text-anchor="start">dispatches</text>

  <!-- the GPU side: the passes write the particles, your shader reads them -->
  <g fill="#15100c" stroke="#e9c27a">
    <rect x="56" y="166" width="152" height="52" rx="8"/>
    <rect x="440" y="166" width="168" height="52" rx="8"/>
  </g>
  <rect x="248" y="166" width="152" height="52" rx="8" fill="#e9c27a" fill-opacity=".14" stroke="#e9c27a"/>
  <g fill="#e9c27a" font-family="Consolas, ui-monospace, monospace">
    <text x="132" y="188">your shader</text>
    <text x="324" y="188">ParticleBuffer</text>
    <text x="524" y="188">FabricCompute.fx</text>
  </g>
  <g fill="#8a7a63" font-size="11">
    <text x="132" y="206">reads by vertex id</text>
    <text x="324" y="206">a record per point</text>
    <text x="524" y="206">the compute passes</text>
  </g>
  <g stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="436" y1="192" x2="404" y2="192"/>
    <line x1="246" y1="192" x2="212" y2="192"/>
  </g>
  <g fill="#8a7a63" font-size="11">
    <text x="420" y="236">write</text>
    <text x="229" y="236">read</text>
  </g>

  <!-- nothing comes back unless asked -->
  <line x1="324" y1="164" x2="324" y2="92" stroke="#8a7a63" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow-muted)"/>
  <text x="332" y="108" fill="#8a7a63" font-size="11" text-anchor="start">ReadBack,</text>
  <text x="332" y="146" fill="#8a7a63" font-size="11" text-anchor="start">only when asked</text>
</svg>
