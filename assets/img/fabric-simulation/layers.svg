<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <!-- the camera -->
  <g fill="#15100c" stroke="#e9c27a">
    <rect x="18" y="104" width="34" height="24" rx="4"/>
    <path d="M52 110 L64 104 V128 L52 122 z"/>
  </g>
  <text x="41" y="150" fill="#8a7a63" font-size="11">camera</text>

  <!-- the sheet, side on: folded over on itself twice, three layers under one point -->
  <path d="M300 24 V188 A9 9 0 0 0 318 188 V62 A27 27 0 0 1 372 62 V214"
        fill="none" stroke="#d9cbb4" stroke-width="3" stroke-linecap="round"/>
  <text x="382" y="218" fill="#8a7a63" font-size="11" text-anchor="start">one sheet, folded twice</text>

  <!-- the ray -->
  <line x1="66" y1="116" x2="610" y2="116" stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="604" y="106" fill="#8a7a63" font-size="11" text-anchor="end">the ray</text>

  <!-- the hits, nearest first -->
  <g fill="#f28c28">
    <circle cx="300" cy="116" r="5"/>
    <circle cx="318" cy="116" r="5"/>
    <circle cx="372" cy="116" r="5"/>
  </g>
  <g fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">
    <text x="309" y="138">0</text>
    <text x="345" y="138">1</text>
    <text x="384" y="138">2</text>
  </g>

  <!-- the distance along the ray -->
  <g stroke="#8a7a63" stroke-width="1">
    <line x1="66" y1="62" x2="66" y2="74"/>
    <line x1="296" y1="68" x2="66" y2="68"/>
  </g>
  <text x="180" y="58" fill="#8a7a63" font-size="11"><tspan font-family="Consolas, ui-monospace, monospace">Distance</tspan> of the front layer, in meters</text>

  <!-- scissors: every layer close behind the front one -->
  <path d="M296 104 V96 H322 V104" fill="none" stroke="#e9c27a" stroke-width="1.5"/>
  <text x="288" y="100" fill="#8a7a63" font-size="11" text-anchor="end">within 2 cm of the front</text>

  <g text-anchor="start">
    <text x="440" y="150" fill="#d9cbb4" font-size="12"><tspan font-family="Consolas, ui-monospace, monospace" fill="#e9c27a">hits[0]</tspan> to <tspan font-family="Consolas, ui-monospace, monospace" fill="#e9c27a">hits[2]</tspan>, nearest first</text>
    <text x="440" y="172" fill="#8a7a63" font-size="12">a blade takes <tspan font-family="Consolas, ui-monospace, monospace" fill="#e9c27a">hits[0]</tspan></text>
    <text x="440" y="192" fill="#8a7a63" font-size="12">scissors take <tspan font-family="Consolas, ui-monospace, monospace" fill="#e9c27a">hits[0]</tspan> and <tspan font-family="Consolas, ui-monospace, monospace" fill="#e9c27a">hits[1]</tspan></text>
  </g>
</svg>
