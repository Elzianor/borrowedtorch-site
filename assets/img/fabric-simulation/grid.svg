<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>
  <!-- the threads along the grid -->
  <g stroke="#8a7a63" stroke-opacity=".55" stroke-width="1">
    <line x1="120" y1="226" x2="400" y2="226"/>
    <line x1="120" y1="170" x2="400" y2="170"/>
    <line x1="120" y1="114" x2="400" y2="114"/>
    <line x1="120" y1="58" x2="400" y2="58"/>
    <line x1="120" y1="226" x2="120" y2="58"/>
    <line x1="176" y1="226" x2="176" y2="58"/>
    <line x1="232" y1="226" x2="232" y2="58"/>
    <line x1="288" y1="226" x2="288" y2="58"/>
    <line x1="344" y1="226" x2="344" y2="58"/>
    <line x1="400" y1="226" x2="400" y2="58"/>
  </g>
  <!-- the points, numbered row by row from the bottom left -->
  <g fill="#e9c27a">
    <circle cx="120" cy="226" r="4.5"/>
    <circle cx="176" cy="226" r="4.5"/>
    <circle cx="232" cy="226" r="4.5"/>
    <circle cx="288" cy="226" r="4.5"/>
    <circle cx="344" cy="226" r="4.5"/>
    <circle cx="400" cy="226" r="4.5"/>
    <circle cx="120" cy="170" r="4.5"/>
    <circle cx="176" cy="170" r="4.5"/>
    <circle cx="232" cy="170" r="4.5"/>
    <circle cx="288" cy="170" r="4.5"/>
    <circle cx="344" cy="170" r="4.5"/>
    <circle cx="400" cy="170" r="4.5"/>
    <circle cx="120" cy="114" r="4.5"/>
    <circle cx="176" cy="114" r="4.5"/>
    <circle cx="232" cy="114" r="4.5"/>
    <circle cx="288" cy="114" r="4.5"/>
    <circle cx="344" cy="114" r="4.5"/>
    <circle cx="400" cy="114" r="4.5"/>
    <circle cx="120" cy="58" r="4.5"/>
    <circle cx="176" cy="58" r="4.5"/>
    <circle cx="232" cy="58" r="4.5"/>
    <circle cx="288" cy="58" r="4.5"/>
    <circle cx="344" cy="58" r="4.5"/>
    <circle cx="400" cy="58" r="4.5"/>
  </g>
  <g fill="#d9cbb4" font-size="11" text-anchor="start" font-family="Consolas, ui-monospace, monospace">
    <text x="126" y="219">0</text>
    <text x="182" y="219">1</text>
    <text x="238" y="219">2</text>
    <text x="294" y="219">3</text>
    <text x="350" y="219">4</text>
    <text x="406" y="219">5</text>
    <text x="126" y="163">6</text>
    <text x="182" y="163">7</text>
    <text x="238" y="163">8</text>
    <text x="294" y="163">9</text>
    <text x="350" y="163">10</text>
    <text x="406" y="163">11</text>
    <text x="126" y="107">12</text>
    <text x="182" y="107">13</text>
    <text x="238" y="107">14</text>
    <text x="294" y="107">15</text>
    <text x="350" y="107">16</text>
    <text x="406" y="107">17</text>
    <text x="126" y="51">18</text>
    <text x="182" y="51">19</text>
    <text x="238" y="51">20</text>
    <text x="294" y="51">21</text>
    <text x="350" y="51">22</text>
    <text x="406" y="51">23</text>
  </g>
  <!-- columns and rows -->
  <g fill="#8a7a63" font-size="11">
    <text x="120" y="246">0</text>
    <text x="176" y="246">1</text>
    <text x="232" y="246">2</text>
    <text x="288" y="246">3</text>
    <text x="344" y="246">4</text>
    <text x="400" y="246">5</text>
    <text x="98" y="230">0</text>
    <text x="98" y="174">1</text>
    <text x="98" y="118">2</text>
    <text x="98" y="62">3</text>
    <text x="260" y="262">column</text>
    <text x="98" y="36">row</text>
  </g>
  <!-- u and v: meters on the flat sheet, from point 0 -->
  <g stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="120" y1="226" x2="168" y2="226"/>
    <line x1="120" y1="226" x2="120" y2="178"/>
  </g>
  <g fill="#e9c27a" font-family="Consolas, ui-monospace, monospace" font-size="12">
    <text x="148.0" y="220">u</text>
    <text x="112" y="202.0">v</text>
  </g>
  <!-- Origin, the middle -->
  <g stroke="#f28c28" stroke-width="2"><line x1="253" y1="142" x2="267" y2="142"/><line x1="260" y1="135" x2="260" y2="149"/></g>
  <text x="270" y="137" fill="#f28c28" font-size="11" text-anchor="start" font-family="Consolas, ui-monospace, monospace">Origin</text>
  <!-- the sizes -->
  <g stroke="#8a7a63" stroke-width="1">
    <line x1="120" y1="28" x2="400" y2="28"/><line x1="120" y1="23" x2="120" y2="33"/><line x1="400" y1="23" x2="400" y2="33"/>
    <line x1="430" y1="58" x2="430" y2="226"/><line x1="425" y1="58" x2="435" y2="58"/><line x1="425" y1="226" x2="435" y2="226"/>
  </g>
  <text x="260" y="20" fill="#8a7a63" font-size="11"><tspan font-family="Consolas, ui-monospace, monospace">Width</tspan> = 5 × <tspan font-family="Consolas, ui-monospace, monospace">RestLength</tspan></text>
  <text x="440" y="138" fill="#8a7a63" font-size="11" text-anchor="start"><tspan font-family="Consolas, ui-monospace, monospace">Height</tspan> =</text>
  <text x="440" y="154" fill="#8a7a63" font-size="11" text-anchor="start">3 × <tspan font-family="Consolas, ui-monospace, monospace">RestLength</tspan></text>
  <!-- the rule -->
  <g text-anchor="start" font-size="12">
    <text x="440" y="76" fill="#d9cbb4">index =</text>
    <text x="440" y="94" fill="#e9c27a" font-family="Consolas, ui-monospace, monospace">row × 6 + column</text>
    <text x="440" y="238" fill="#8a7a63" font-size="11">(0, 0) on the flat sheet</text>
    <text x="440" y="253" fill="#8a7a63" font-size="11">is point 0</text>
  </g>
</svg>
