<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" width="640" height="222" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <!-- the time -->
  <text x="184" y="20" fill="#8a7a63" font-size="11">0 ms</text>
  <line x1="184" y1="28" x2="184" y2="184" stroke="#a8834a" stroke-opacity=".7" stroke-dasharray="3 4"/>
  <text x="291.5" y="20" fill="#8a7a63" font-size="11">25</text>
  <line x1="291.5" y1="28" x2="291.5" y2="184" stroke="#a8834a" stroke-opacity=".7" stroke-dasharray="3 4"/>
  <text x="399" y="20" fill="#8a7a63" font-size="11">50</text>
  <line x1="399" y1="28" x2="399" y2="184" stroke="#a8834a" stroke-opacity=".7" stroke-dasharray="3 4"/>
  <text x="506.5" y="20" fill="#8a7a63" font-size="11">75</text>
  <line x1="506.5" y1="28" x2="506.5" y2="184" stroke="#a8834a" stroke-opacity=".7" stroke-dasharray="3 4"/>
  <text x="614" y="20" fill="#8a7a63" font-size="11">100 ms</text>
  <line x1="614" y1="28" x2="614" y2="184" stroke="#a8834a" stroke-opacity=".7" stroke-dasharray="3 4"/>

  <!-- the frames, 25 ms each -->
  <text x="20" y="46" fill="#d9cbb4" text-anchor="start">Frames</text>
  <rect x="186" y="32" width="103.5" height="20" rx="4" fill="#e9c27a" fill-opacity=".85"/>
  <text x="237.75" y="46" fill="#100c09" font-size="11" font-weight="600">Draw</text>
  <rect x="293.5" y="32" width="103.5" height="20" rx="4" fill="#e9c27a" fill-opacity=".65"/>
  <text x="345.25" y="46" fill="#100c09" font-size="11" font-weight="600">Draw</text>
  <rect x="401" y="32" width="103.5" height="20" rx="4" fill="#e9c27a" fill-opacity=".85"/>
  <text x="452.75" y="46" fill="#100c09" font-size="11" font-weight="600">Draw</text>
  <rect x="508.5" y="32" width="103.5" height="20" rx="4" fill="#e9c27a" fill-opacity=".65"/>
  <text x="560.25" y="46" fill="#100c09" font-size="11" font-weight="600">Draw</text>

  <!-- the updates run before each draw: as many whole 16.7 ms steps as the game owes -->
  <text x="20" y="80" fill="#d9cbb4" text-anchor="start">Game.Update</text>
  <rect x="190" y="68" width="14" height="16" rx="3" fill="#f28c28" fill-opacity=".85"/>
  <text x="212" y="80" fill="#8a7a63" font-size="11" text-anchor="start">×1</text>
  <rect x="297.5" y="68" width="14" height="16" rx="3" fill="#f28c28" fill-opacity=".85"/>
  <rect x="315.5" y="68" width="14" height="16" rx="3" fill="#f28c28" fill-opacity=".85"/>
  <text x="337.5" y="80" fill="#8a7a63" font-size="11" text-anchor="start">×2</text>
  <rect x="405" y="68" width="14" height="16" rx="3" fill="#f28c28" fill-opacity=".85"/>
  <text x="427" y="80" fill="#8a7a63" font-size="11" text-anchor="start">×1</text>
  <rect x="512.5" y="68" width="14" height="16" rx="3" fill="#f28c28" fill-opacity=".85"/>
  <rect x="530.5" y="68" width="14" height="16" rx="3" fill="#f28c28" fill-opacity=".85"/>
  <text x="552.5" y="80" fill="#8a7a63" font-size="11" text-anchor="start">×2</text>

  <!-- the elapsed time each frame gets -->
  <text x="20" y="114" fill="#d9cbb4" text-anchor="start">ElapsedGameTime</text>
  <text x="20" y="129" fill="#8a7a63" font-size="11" text-anchor="start">gameTime in Draw</text>
  <text x="20" y="160" fill="#d9cbb4" text-anchor="start">FrameTime</text>
  <text x="20" y="175" fill="#8a7a63" font-size="11" text-anchor="start">the counter's own clock</text>
  <g font-family="Consolas, ui-monospace, monospace" font-size="11" stroke="#100c09" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
    <text x="237.75" y="121" fill="#f28c28">16.7 ms</text>
    <text x="237.75" y="167" fill="#e9c27a">25.0 ms</text>
    <text x="345.25" y="121" fill="#f28c28">33.3 ms</text>
    <text x="345.25" y="167" fill="#e9c27a">25.0 ms</text>
    <text x="452.75" y="121" fill="#f28c28">16.7 ms</text>
    <text x="452.75" y="167" fill="#e9c27a">25.0 ms</text>
    <text x="560.25" y="121" fill="#f28c28">33.3 ms</text>
    <text x="560.25" y="167" fill="#e9c27a">25.0 ms</text>
  </g>

  <text x="20" y="212" fill="#8a7a63" font-size="11" text-anchor="start">In 100 ms, six updates and four drawn frames: 60 a second counted in Update, 40 counted in Draw.</text>
</svg>
