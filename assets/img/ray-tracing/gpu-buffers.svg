<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <!-- buffer names -->
  <g text-anchor="start">
    <g fill="#d9cbb4" font-family="Consolas, ui-monospace, monospace" font-size="12">
      <text x="16" y="34">TlasNodes</text>
      <text x="16" y="100">Instances</text>
      <text x="16" y="166">BlasNodes</text>
      <text x="16" y="232">Triangles</text>
    </g>
    <g fill="#8a7a63" font-size="11">
      <text x="16" y="49">the scene's tree</text>
      <text x="16" y="115">one record each</text>
      <text x="16" y="181">every BLAS</text>
      <text x="16" y="247">every BLAS</text>
    </g>
  </g>

  <!-- the scene's tree, depth-first: the root, a leaf, a node, two leaves -->
  <g fill="#15100c" stroke="#e9c27a">
    <rect x="140" y="20" width="44" height="32" rx="6" stroke-opacity=".45"/>
    <rect x="190" y="20" width="44" height="32" rx="6"/>
    <rect x="240" y="20" width="44" height="32" rx="6" stroke-opacity=".45"/>
    <rect x="290" y="20" width="44" height="32" rx="6"/>
    <rect x="340" y="20" width="44" height="32" rx="6"/>
  </g>
  <g fill="#8a7a63" font-size="11" font-family="Consolas, ui-monospace, monospace">
    <text x="162" y="40">0</text><text x="212" y="40" fill="#e9c27a">1</text><text x="262" y="40">2</text>
    <text x="312" y="40" fill="#e9c27a">3</text><text x="362" y="40" fill="#e9c27a">4</text>
  </g>
  <text x="400" y="40" fill="#8a7a63" font-size="11" text-anchor="start">each leaf points at its record</text>

  <!-- the instance records, in the tree's order -->
  <g stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="212" y1="54" x2="214" y2="84"/>
    <line x1="312" y1="54" x2="370" y2="84"/>
    <line x1="362" y1="54" x2="528" y2="84"/>
  </g>
  <g fill="#15100c">
    <rect x="140" y="86" width="150" height="34" rx="6" stroke="#e9c27a"/>
    <rect x="300" y="86" width="150" height="34" rx="6" stroke="#e9c27a"/>
    <rect x="460" y="86" width="150" height="34" rx="6" stroke="#8ab4d8"/>
  </g>
  <text x="215" y="108" fill="#e9c27a">crate 1</text>
  <text x="375" y="108" fill="#e9c27a">crate 2</text>
  <text x="535" y="108" fill="#8ab4d8">barrel</text>

  <!-- each record points at its BLAS's first node: both crates at the same run -->
  <g stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="200" y1="122" x2="160" y2="150"/>
    <line x1="360" y1="122" x2="170" y2="150"/>
    <line x1="520" y1="122" x2="266" y2="150"/>
  </g>

  <!-- every BLAS's nodes, one run after the other, then the spare room -->
  <g fill="#15100c" stroke="#e9c27a">
    <rect x="140" y="152" width="30" height="32" rx="5"/>
    <rect x="174" y="152" width="30" height="32" rx="5"/>
    <rect x="208" y="152" width="30" height="32" rx="5"/>
  </g>
  <g fill="#15100c" stroke="#8ab4d8">
    <rect x="248" y="152" width="30" height="32" rx="5"/>
    <rect x="282" y="152" width="30" height="32" rx="5"/>
    <rect x="316" y="152" width="30" height="32" rx="5"/>
    <rect x="350" y="152" width="30" height="32" rx="5"/>
    <rect x="384" y="152" width="30" height="32" rx="5"/>
    <rect x="418" y="152" width="30" height="32" rx="5"/>
    <rect x="452" y="152" width="30" height="32" rx="5"/>
  </g>
  <rect x="492" y="152" width="118" height="32" rx="5" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
  <text x="551" y="172" fill="#8a7a63" font-size="11">spare room</text>

  <!-- and their triangles, the same way -->
  <g stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="189" y1="186" x2="189" y2="214"/>
    <line x1="365" y1="186" x2="365" y2="214"/>
  </g>
  <rect x="140" y="218" width="98" height="32" rx="5" fill="#15100c" stroke="#e9c27a"/>
  <rect x="248" y="218" width="234" height="32" rx="5" fill="#15100c" stroke="#8ab4d8"/>
  <rect x="492" y="218" width="118" height="32" rx="5" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
  <g font-size="11">
    <text x="189" y="238" fill="#e9c27a">the crate's</text>
    <text x="365" y="238" fill="#8ab4d8">the barrel's</text>
    <text x="551" y="238" fill="#8a7a63">spare room</text>
  </g>
</svg>
