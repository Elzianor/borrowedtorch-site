<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <!-- the camera's forward axis, view-space -Z -->
  <line x1="60" y1="120" x2="616" y2="120" stroke="#8a7a63" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="612" y="110" fill="#8a7a63" font-size="11" text-anchor="end">forward, −Z</text>

  <!-- the near plane, and a pixel's centre on it -->
  <line x1="140" y1="60" x2="140" y2="176" stroke="#8a7a63"/>
  <text x="140" y="52" fill="#8a7a63" font-size="11">near plane</text>
  <rect x="136" y="100" width="8" height="8" fill="#e9c27a"/>
  <text x="130" y="96" fill="#d9cbb4" font-size="11" text-anchor="end">pixel</text>

  <!-- the surface -->
  <line x1="380" y1="30" x2="520" y2="200" stroke="#d9cbb4" stroke-width="3" stroke-linecap="round"/>
  <text x="530" y="200" fill="#d9cbb4" text-anchor="start">surface</text>

  <!-- the line from the eye through the pixel's centre, out to the surface -->
  <line x1="60" y1="120" x2="398.4" y2="52.3" stroke="#e9c27a" stroke-width="1.5"/>
  <text x="250" y="76" fill="#e9c27a" font-size="11" transform="rotate(-11.3 250 76)">the pixel's line</text>

  <!-- the eye -->
  <circle cx="60" cy="120" r="5" fill="#e9c27a"/>
  <text x="60" y="142" fill="#8a7a63" font-size="11">eye</text>

  <!-- the point rebuilt, and its distance along the forward axis -->
  <line x1="398.4" y1="52.3" x2="398.4" y2="166" stroke="#8a7a63" stroke-dasharray="4 3"/>
  <circle cx="398.4" cy="52.3" r="4.5" fill="#f28c28"/>
  <text x="412" y="46" fill="#f28c28" text-anchor="start">the point rebuilt</text>

  <line x1="60" y1="154" x2="60" y2="166" stroke="#a8834a" stroke-width="1.5"/>
  <line x1="62" y1="160" x2="396" y2="160" stroke="#a8834a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="229" y="182" fill="#d9cbb4" font-family="Consolas, ui-monospace, monospace" font-size="12">depth = −PositionVS.z</text>
  <text x="229" y="200" fill="#8a7a63" font-size="11">what the prepass stored</text>
</svg>
