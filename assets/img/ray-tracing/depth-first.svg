<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <g fill="#8a7a63" text-anchor="start">
    <text x="16" y="84">Tree</text>
    <text x="16" y="200">Array</text>
  </g>

  <!-- the tree: 0 splits into 1 and 4, 1 into the leaves 2 and 3, 4 into the leaves 5 and 6 -->
  <g stroke="#8a7a63">
    <line x1="320" y1="30" x2="200" y2="80"/>
    <line x1="320" y1="30" x2="440" y2="80"/>
    <line x1="200" y1="80" x2="140" y2="132"/>
    <line x1="200" y1="80" x2="260" y2="132"/>
    <line x1="440" y1="80" x2="380" y2="132"/>
    <line x1="440" y1="80" x2="500" y2="132"/>
  </g>
  <g fill="#15100c" stroke="#e9c27a">
    <circle cx="320" cy="30" r="15"/>
    <circle cx="200" cy="80" r="15"/>
    <circle cx="440" cy="80" r="15"/>
  </g>
  <g fill="#15100c" stroke="#e9c27a" stroke-opacity=".45">
    <rect x="126" y="118" width="28" height="28" rx="5"/>
    <rect x="246" y="118" width="28" height="28" rx="5"/>
    <rect x="366" y="118" width="28" height="28" rx="5"/>
    <rect x="486" y="118" width="28" height="28" rx="5"/>
  </g>
  <g font-family="Consolas, ui-monospace, monospace">
    <g fill="#e9c27a">
      <text x="320" y="35">0</text><text x="200" y="85">1</text><text x="440" y="85">4</text>
    </g>
    <g fill="#d9cbb4">
      <text x="140" y="137">2</text><text x="260" y="137">3</text><text x="380" y="137">5</text><text x="500" y="137">6</text>
    </g>
  </g>
  <g fill="#8a7a63" font-size="11" text-anchor="start">
    <text x="344" y="34">interior node</text>
    <text x="528" y="136">leaf</text>
  </g>

  <!-- the same nodes in the array, depth-first -->
  <g fill="#15100c" stroke="#e9c27a">
    <rect x="80" y="180" width="60" height="32" rx="6"/>
    <rect x="148" y="180" width="60" height="32" rx="6"/>
    <rect x="216" y="180" width="60" height="32" rx="6" stroke-opacity=".45"/>
    <rect x="284" y="180" width="60" height="32" rx="6" stroke-opacity=".45"/>
    <rect x="352" y="180" width="60" height="32" rx="6"/>
    <rect x="420" y="180" width="60" height="32" rx="6" stroke-opacity=".45"/>
    <rect x="488" y="180" width="60" height="32" rx="6" stroke-opacity=".45"/>
  </g>
  <rect x="556" y="180" width="60" height="32" rx="6" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
  <g font-family="Consolas, ui-monospace, monospace">
    <g fill="#e9c27a">
      <text x="110" y="201">0</text><text x="178" y="201">1</text><text x="382" y="201">4</text>
    </g>
    <g fill="#d9cbb4">
      <text x="246" y="201">2</text><text x="314" y="201">3</text><text x="450" y="201">5</text><text x="518" y="201">6</text>
    </g>
  </g>
  <text x="586" y="200" fill="#8a7a63" font-size="11">end</text>

  <!-- the interior nodes' skips: past their subtrees -->
  <g fill="none" stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M178 214 Q280 244 378 216"/>
    <path d="M382 214 Q484 244 582 216"/>
    <path d="M110 214 Q346 276 580 216"/>
  </g>
  <text x="16" y="244" fill="#8a7a63" text-anchor="start">Skips</text>
</svg>
