<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <!-- the updates -->
  <text x="20" y="24" fill="#8a7a63" font-size="11" text-anchor="start">Update</text>
  <text x="160" y="24" fill="#8a7a63" font-size="11">1</text>
  <text x="214" y="24" fill="#8a7a63" font-size="11">2</text>
  <text x="268" y="24" fill="#8a7a63" font-size="11">3</text>
  <text x="322" y="24" fill="#8a7a63" font-size="11">4</text>
  <text x="376" y="24" fill="#8a7a63" font-size="11">5</text>
  <text x="430" y="24" fill="#8a7a63" font-size="11">6</text>
  <text x="484" y="24" fill="#8a7a63" font-size="11">7</text>
  <text x="538" y="24" fill="#8a7a63" font-size="11">8</text>
  <text x="592" y="24" fill="#8a7a63" font-size="11">9</text>

  <!-- when the key is held, as the update reads it -->
  <text x="20" y="52" fill="#d9cbb4" text-anchor="start">Key held</text>
  <rect x="190" y="40" width="156" height="16" rx="5" fill="#e9c27a" fill-opacity=".85"/>
  <rect x="460" y="40" width="48" height="16" rx="5" fill="#e9c27a" fill-opacity=".85"/>

  <!-- its state -->
  <text x="20" y="84" fill="#d9cbb4" text-anchor="start">State</text>
  <g font-family="Consolas, ui-monospace, monospace" font-size="11">
    <text x="160" y="84" fill="#8a7a63">Idle</text>
    <text x="214" y="84" fill="#e9c27a">Pressed</text>
    <text x="268" y="84" fill="#d9cbb4">Down</text>
    <text x="322" y="84" fill="#d9cbb4">Down</text>
    <text x="376" y="84" fill="#f28c28">Up</text>
    <text x="430" y="84" fill="#8a7a63">Idle</text>
    <text x="484" y="84" fill="#e9c27a">Pressed</text>
    <text x="538" y="84" fill="#f28c28">Up</text>
    <text x="592" y="84" fill="#8a7a63">Idle</text>
  </g>

  <line x1="20" y1="100" x2="620" y2="100" stroke="#8a7a63" stroke-opacity=".4"/>
  <text x="20" y="120" fill="#8a7a63" font-size="11" text-anchor="start">The checks, true at</text>

  <!-- Idle -->
  <text x="20" y="146" fill="#e9c27a" font-size="12" font-family="Consolas, ui-monospace, monospace" text-anchor="start">Idle</text>
  <circle cx="160" cy="142" r="5.5" fill="#e9c27a"/>
  <circle cx="214" cy="142" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="268" cy="142" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="322" cy="142" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="376" cy="142" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="430" cy="142" r="5.5" fill="#e9c27a"/>
  <circle cx="484" cy="142" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="538" cy="142" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="592" cy="142" r="5.5" fill="#e9c27a"/>

  <!-- Pressed -->
  <text x="20" y="166" fill="#e9c27a" font-size="12" font-family="Consolas, ui-monospace, monospace" text-anchor="start">Pressed</text>
  <circle cx="160" cy="162" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="214" cy="162" r="5.5" fill="#e9c27a"/>
  <circle cx="268" cy="162" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="322" cy="162" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="376" cy="162" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="430" cy="162" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="484" cy="162" r="5.5" fill="#e9c27a"/>
  <circle cx="538" cy="162" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="592" cy="162" r="2" fill="#8a7a63" fill-opacity=".6"/>

  <!-- Down -->
  <text x="20" y="186" fill="#e9c27a" font-size="12" font-family="Consolas, ui-monospace, monospace" text-anchor="start">Down</text>
  <circle cx="160" cy="182" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="214" cy="182" r="5.5" fill="#e9c27a"/>
  <circle cx="268" cy="182" r="5.5" fill="#e9c27a"/>
  <circle cx="322" cy="182" r="5.5" fill="#e9c27a"/>
  <circle cx="376" cy="182" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="430" cy="182" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="484" cy="182" r="5.5" fill="#e9c27a"/>
  <circle cx="538" cy="182" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="592" cy="182" r="2" fill="#8a7a63" fill-opacity=".6"/>

  <!-- Up -->
  <text x="20" y="206" fill="#e9c27a" font-size="12" font-family="Consolas, ui-monospace, monospace" text-anchor="start">Up</text>
  <circle cx="160" cy="202" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="214" cy="202" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="268" cy="202" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="322" cy="202" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="376" cy="202" r="5.5" fill="#e9c27a"/>
  <circle cx="430" cy="202" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="484" cy="202" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="538" cy="202" r="5.5" fill="#e9c27a"/>
  <circle cx="592" cy="202" r="2" fill="#8a7a63" fill-opacity=".6"/>

  <!-- Active -->
  <text x="20" y="226" fill="#e9c27a" font-size="12" font-family="Consolas, ui-monospace, monospace" text-anchor="start">Active</text>
  <circle cx="160" cy="222" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="214" cy="222" r="5.5" fill="#e9c27a"/>
  <circle cx="268" cy="222" r="5.5" fill="#e9c27a"/>
  <circle cx="322" cy="222" r="5.5" fill="#e9c27a"/>
  <circle cx="376" cy="222" r="5.5" fill="#e9c27a"/>
  <circle cx="430" cy="222" r="2" fill="#8a7a63" fill-opacity=".6"/>
  <circle cx="484" cy="222" r="5.5" fill="#e9c27a"/>
  <circle cx="538" cy="222" r="5.5" fill="#e9c27a"/>
  <circle cx="592" cy="222" r="2" fill="#8a7a63" fill-opacity=".6"/>
</svg>
