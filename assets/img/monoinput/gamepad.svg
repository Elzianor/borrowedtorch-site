<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <!-- the triggers and the bumpers, behind the body -->
  <rect x="208" y="30" width="46" height="18" rx="7" fill="#15100c" stroke="#d9cbb4"/>
  <rect x="386" y="30" width="46" height="18" rx="7" fill="#15100c" stroke="#d9cbb4"/>
  <rect x="200" y="54" width="62" height="11" rx="5" fill="#15100c" stroke="#d9cbb4"/>
  <rect x="378" y="54" width="62" height="11" rx="5" fill="#15100c" stroke="#d9cbb4"/>

  <!-- the body -->
  <path d="M225 72 C270 62, 370 62, 415 72 C455 80, 470 130, 478 190 C484 240, 455 258, 432 240 C412 224, 398 200, 375 198 L265 198 C242 200, 228 224, 208 240 C185 258, 156 240, 162 190 C170 130, 185 80, 225 72 Z" fill="#15100c" stroke="#e9c27a" stroke-width="1.5"/>

  <!-- the sticks -->
  <circle cx="232" cy="112" r="20" fill="none" stroke="#d9cbb4"/>
  <circle cx="232" cy="112" r="11" fill="#e9c27a" fill-opacity=".25" stroke="#e9c27a"/>
  <circle cx="368" cy="158" r="20" fill="none" stroke="#d9cbb4"/>
  <circle cx="368" cy="158" r="11" fill="#e9c27a" fill-opacity=".25" stroke="#e9c27a"/>

  <!-- the D-pad -->
  <path d="M266 140 h12 v12 h12 v12 h-12 v12 h-12 v-12 h-12 v-12 h12 z" fill="none" stroke="#d9cbb4"/>

  <!-- the face buttons -->
  <g fill="none" stroke="#d9cbb4">
    <circle cx="408" cy="94" r="8"/>
    <circle cx="390" cy="112" r="8"/>
    <circle cx="426" cy="112" r="8"/>
    <circle cx="408" cy="130" r="8"/>
  </g>
  <g fill="#e9c27a" font-size="9" font-family="Consolas, ui-monospace, monospace">
    <text x="408" y="97">Y</text>
    <text x="390" y="115">X</text>
    <text x="426" y="115">B</text>
    <text x="408" y="133">A</text>
  </g>

  <!-- Back, Home and Start -->
  <rect x="289" y="100" width="14" height="8" rx="4" fill="none" stroke="#d9cbb4"/>
  <circle cx="320" cy="92" r="9" fill="none" stroke="#d9cbb4"/>
  <rect x="337" y="100" width="14" height="8" rx="4" fill="none" stroke="#d9cbb4"/>
  <g stroke="#a8834a" stroke-width="1">
    <line x1="291" y1="45" x2="296" y2="98"/>
    <line x1="320" y1="29" x2="320" y2="81"/>
    <line x1="349" y1="45" x2="344" y2="98"/>
  </g>
  <g fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">
    <text x="287" y="41">Back</text>
    <text x="320" y="25">Home</text>
    <text x="353" y="41">Start</text>
  </g>

  <!-- leader lines to the parts on each side -->
  <g stroke="#a8834a" stroke-width="1" fill="none">
    <polyline points="154,38 208,38"/>
    <polyline points="154,76 186,76 200,60"/>
    <polyline points="154,114 212,114"/>
    <polyline points="154,160 254,158"/>
    <polyline points="486,38 432,38"/>
    <polyline points="486,76 454,76 440,60"/>
    <polyline points="486,114 434,113"/>
    <polyline points="486,160 388,158"/>
  </g>

  <!-- the left side -->
  <g text-anchor="end">
    <text x="150" y="36" fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">LeftTriggerValue</text>
    <text x="150" y="50" fill="#8a7a63" font-size="11">pulled, 0 to 1</text>
    <text x="150" y="74" fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">LeftShoulder</text>
    <text x="150" y="88" fill="#8a7a63" font-size="11">the bumper</text>
    <text x="150" y="112" fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">LeftStickShift</text>
    <text x="150" y="126" fill="#8a7a63" font-size="11">pressed in: LeftStick</text>
    <text x="150" y="158" fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">Up Down Left Right</text>
    <text x="150" y="172" fill="#8a7a63" font-size="11">the D-pad</text>
  </g>

  <!-- the right side -->
  <g text-anchor="start">
    <text x="490" y="36" fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">RightTriggerValue</text>
    <text x="490" y="50" fill="#8a7a63" font-size="11">pulled, 0 to 1</text>
    <text x="490" y="74" fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">RightShoulder</text>
    <text x="490" y="88" fill="#8a7a63" font-size="11">the bumper</text>
    <text x="490" y="112" fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">A B X Y</text>
    <text x="490" y="126" fill="#8a7a63" font-size="11">the face buttons</text>
    <text x="490" y="158" fill="#e9c27a" font-size="11" font-family="Consolas, ui-monospace, monospace">RightStickShift</text>
    <text x="490" y="172" fill="#8a7a63" font-size="11">pressed in: RightStick</text>
  </g>
</svg>
