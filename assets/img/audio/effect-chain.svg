<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <!-- clip and mix: outside the emitter -->
  <rect x="8" y="30" width="64" height="40" rx="8" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
  <text x="40" y="55" fill="#8a7a63">Clip</text>
  <rect x="560" y="30" width="72" height="40" rx="8" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
  <text x="596" y="55" fill="#8a7a63">Mix</text>

  <!-- the fixed ends -->
  <rect x="92" y="30" width="72" height="40" rx="8" fill="#15100c" stroke="#e9c27a"/>
  <text x="128" y="55" fill="#e9c27a">Send</text>
  <rect x="468" y="30" width="72" height="40" rx="8" fill="#15100c" stroke="#e9c27a"/>
  <text x="504" y="55" fill="#e9c27a">Return</text>

  <!-- the effects -->
  <rect x="184" y="30" width="80" height="40" rx="8" fill="#15100c" stroke="#e9c27a" stroke-opacity=".45"/>
  <text x="224" y="55" fill="#d9cbb4">Distance</text>
  <rect x="284" y="30" width="72" height="40" rx="8" fill="#15100c" stroke="#e9c27a" stroke-opacity=".45"/>
  <text x="320" y="55" fill="#d9cbb4">Reverb</text>
  <rect x="376" y="30" width="72" height="40" rx="8" fill="#15100c" stroke="#e9c27a" stroke-opacity=".45"/>
  <text x="412" y="55" fill="#d9cbb4">Spatial</text>

  <!-- the line -->
  <g stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="72" y1="50" x2="90" y2="50"/>
    <line x1="164" y1="50" x2="182" y2="50"/>
    <line x1="264" y1="50" x2="282" y2="50"/>
    <line x1="356" y1="50" x2="374" y2="50"/>
    <line x1="448" y1="50" x2="466" y2="50"/>
    <line x1="540" y1="50" x2="558" y2="50"/>
  </g>

  <!-- the reverb's send to the bus -->
  <line x1="320" y1="70" x2="320" y2="102" stroke="#a8834a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="266" y="104" width="108" height="34" rx="8" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
  <text x="320" y="126" fill="#8a7a63">Reverb bus</text>

  <!-- the emitter's extent -->
  <text x="316" y="18" fill="#8a7a63" font-size="11">the emitter's chain</text>
  <path d="M92 22 V16 H254 M378 16 H540 V22" fill="none" stroke="#8a7a63" stroke-width="1"/>
</svg>
