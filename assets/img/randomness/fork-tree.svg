<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <!-- the world stream -->
  <rect x="8" y="78" width="112" height="44" rx="8" fill="#15100c" stroke="#e9c27a"/>
  <text x="64" y="97" fill="#e9c27a">World</text>
  <text x="64" y="113" fill="#8a7a63" font-size="11" font-family="Consolas, ui-monospace, monospace">Rng(worldSeed)</text>

  <!-- the forks -->
  <g font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#d9cbb4">
    <rect x="200" y="12" width="168" height="34" rx="8" fill="#15100c" stroke="#e9c27a" stroke-opacity=".45"/>
    <text x="284" y="33">Fork("maze", 1)</text>
    <rect x="200" y="60" width="168" height="34" rx="8" fill="#15100c" stroke="#e9c27a" stroke-opacity=".45"/>
    <text x="284" y="81">Fork("maze", 2)</text>
    <rect x="200" y="108" width="168" height="34" rx="8" fill="#15100c" stroke="#e9c27a" stroke-opacity=".45"/>
    <text x="284" y="129">Fork("loot")</text>
    <rect x="200" y="156" width="168" height="34" rx="8" fill="#15100c" stroke="#e9c27a" stroke-opacity=".45"/>
    <text x="284" y="177">Fork("caves").Seed</text>
  </g>

  <!-- what uses them: outside the library -->
  <g fill="#8a7a63">
    <rect x="448" y="12" width="184" height="34" rx="8" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
    <text x="540" y="33">The maze of floor 1</text>
    <rect x="448" y="60" width="184" height="34" rx="8" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
    <text x="540" y="81">The maze of floor 2</text>
    <rect x="448" y="108" width="184" height="34" rx="8" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
    <text x="540" y="129">Loot rolls</text>
    <rect x="448" y="156" width="184" height="34" rx="8" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
    <text x="540" y="177">A FractalNoise for caves</text>
  </g>

  <!-- the forks branch from the world's seed -->
  <g fill="none" stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M120 100 H160 V29 H198"/>
    <path d="M120 100 H160 V77 H198"/>
    <path d="M120 100 H160 V125 H198"/>
    <path d="M120 100 H160 V173 H198"/>
  </g>
  <g stroke="#a8834a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <line x1="368" y1="29" x2="446" y2="29"/>
    <line x1="368" y1="77" x2="446" y2="77"/>
    <line x1="368" y1="125" x2="446" y2="125"/>
    <line x1="368" y1="173" x2="446" y2="173"/>
  </g>
</svg>
