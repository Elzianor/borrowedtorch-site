<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <!-- id 3, held by two entities one after the other -->
  <rect x="20" y="24" width="210" height="48" rx="8" fill="#15100c" stroke="#e9c27a"/>
  <text x="125" y="44" fill="#e9c27a">The goblin</text>
  <text x="125" y="62" fill="#8a7a63" font-size="11" font-family="Consolas, ui-monospace, monospace">Entity(3:gen.0)</text>

  <rect x="410" y="24" width="210" height="48" rx="8" fill="#15100c" stroke="#e9c27a"/>
  <text x="515" y="44" fill="#e9c27a">The bat, created next</text>
  <text x="515" y="62" fill="#8a7a63" font-size="11" font-family="Consolas, ui-monospace, monospace">Entity(3:gen.1)</text>

  <line x1="232" y1="48" x2="406" y2="48" stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="39" fill="#d9cbb4" font-size="11" font-family="Consolas, ui-monospace, monospace">DestroyEntity(goblin)</text>
  <text x="320" y="66" fill="#8a7a63" font-size="11">id 3 freed, its generation 0 → 1</text>

  <!-- a copy of the goblin's handle, kept somewhere -->
  <line x1="125" y1="74" x2="125" y2="136" stroke="#a8834a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="135" y="109" fill="#8a7a63" font-size="11" text-anchor="start">kept in a component</text>

  <rect x="20" y="140" width="210" height="48" rx="8" fill="none" stroke="#8a7a63" stroke-dasharray="4 3"/>
  <text x="125" y="160" fill="#8a7a63">The old handle</text>
  <text x="125" y="178" fill="#d9cbb4" font-size="11" font-family="Consolas, ui-monospace, monospace">Entity(3:gen.0)</text>

  <line x1="232" y1="164" x2="406" y2="164" stroke="#a8834a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="320" y="155" fill="#8a7a63" font-size="11">used after the destroy</text>

  <rect x="410" y="140" width="210" height="48" rx="8" fill="none" stroke="#f28c28" stroke-opacity=".6" stroke-dasharray="4 3"/>
  <text x="515" y="160" fill="#f28c28">Not alive</text>
  <text x="515" y="178" fill="#8a7a63" font-size="11">gen.0 ≠ gen.1: the bat is safe</text>
</svg>
