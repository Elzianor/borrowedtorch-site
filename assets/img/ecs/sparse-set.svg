<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8834a"/>
    </marker>
  </defs>

  <!-- row names -->
  <g fill="#8a7a63" text-anchor="start">
    <text x="16" y="56">Sparse</text>
    <text x="16" y="72" font-size="11">by entity id</text>
    <text x="16" y="162">Entities</text>
    <text x="16" y="202">Components</text>
    <text x="16" y="236" font-size="11">packed index</text>
  </g>

  <!-- the sparse array: entity id to packed index, -1 for none -->
  <g font-size="11" fill="#8a7a63">
    <text x="158" y="32">0</text><text x="220" y="32">1</text><text x="282" y="32">2</text><text x="344" y="32">3</text>
    <text x="406" y="32">4</text><text x="468" y="32">5</text><text x="530" y="32">6</text><text x="592" y="32">7</text>
  </g>
  <g fill="#15100c" stroke="#e9c27a" stroke-opacity=".45">
    <rect x="130" y="40" width="56" height="34" rx="6"/>
    <rect x="192" y="40" width="56" height="34" rx="6" stroke-opacity="1"/>
    <rect x="254" y="40" width="56" height="34" rx="6"/>
    <rect x="316" y="40" width="56" height="34" rx="6" stroke-opacity="1"/>
    <rect x="378" y="40" width="56" height="34" rx="6"/>
    <rect x="440" y="40" width="56" height="34" rx="6" stroke-opacity="1"/>
    <rect x="502" y="40" width="56" height="34" rx="6" stroke-opacity="1"/>
    <rect x="564" y="40" width="56" height="34" rx="6"/>
  </g>
  <g font-family="Consolas, ui-monospace, monospace" font-size="13">
    <text x="158" y="62" fill="#8a7a63">−1</text><text x="220" y="62" fill="#e9c27a">1</text>
    <text x="282" y="62" fill="#8a7a63">−1</text><text x="344" y="62" fill="#e9c27a">0</text>
    <text x="406" y="62" fill="#8a7a63">−1</text><text x="468" y="62" fill="#e9c27a">3</text>
    <text x="530" y="62" fill="#e9c27a">2</text><text x="592" y="62" fill="#8a7a63">−1</text>
  </g>

  <!-- each id with a component points at its packed index -->
  <g stroke="#a8834a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="220" y1="76" x2="305" y2="136"/>
    <line x1="344" y1="76" x2="190" y2="136"/>
    <line x1="468" y1="76" x2="552" y2="136"/>
    <line x1="530" y1="76" x2="438" y2="136"/>
  </g>

  <!-- the packed arrays, index for index -->
  <g fill="#15100c" stroke="#e9c27a">
    <rect x="130" y="140" width="110" height="34" rx="6"/>
    <rect x="254" y="140" width="110" height="34" rx="6"/>
    <rect x="378" y="140" width="110" height="34" rx="6"/>
    <rect x="502" y="140" width="110" height="34" rx="6"/>
  </g>
  <g fill="#15100c" stroke="#e9c27a" stroke-opacity=".45">
    <rect x="130" y="180" width="110" height="34" rx="6"/>
    <rect x="254" y="180" width="110" height="34" rx="6"/>
    <rect x="378" y="180" width="110" height="34" rx="6"/>
    <rect x="502" y="180" width="110" height="34" rx="6"/>
  </g>
  <g font-family="Consolas, ui-monospace, monospace" font-size="12">
    <g fill="#e9c27a">
      <text x="185" y="162">Entity 3</text><text x="309" y="162">Entity 1</text>
      <text x="433" y="162">Entity 6</text><text x="557" y="162">Entity 5</text>
    </g>
    <g fill="#d9cbb4">
      <text x="185" y="202">Health 80</text><text x="309" y="202">Health 25</text>
      <text x="433" y="202">Health 100</text><text x="557" y="202">Health 60</text>
    </g>
  </g>
  <g font-size="11" fill="#8a7a63">
    <text x="185" y="236">0</text><text x="309" y="236">1</text><text x="433" y="236">2</text><text x="557" y="236">3</text>
  </g>
</svg>
