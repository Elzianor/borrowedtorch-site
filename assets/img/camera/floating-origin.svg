<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" text-anchor="middle">
  <!-- world X from 0 to 3000: x = 30 + X * 0.13 -->
  <g fill="#8a7a63" font-size="11">
    <text x="30" y="24">0</text>
    <text x="160" y="24">1000</text>
    <text x="290" y="24">2000</text>
    <text x="420" y="24">3000</text>
  </g>
  <g stroke="#e9c27a" stroke-opacity=".2" stroke-dasharray="4 3">
    <line x1="30" y1="32" x2="30" y2="186"/>
    <line x1="160" y1="32" x2="160" y2="186"/>
    <line x1="290" y1="32" x2="290" y2="186"/>
    <line x1="420" y1="32" x2="420" y2="186"/>
  </g>

  <!-- legend -->
  <polygon points="476,14 482,20 476,26 470,20" fill="#e9c27a"/>
  <text x="488" y="24" fill="#d9cbb4" font-size="12" text-anchor="start">Offset</text>
  <circle cx="556" cy="20" r="5" fill="#d9cbb4"/>
  <text x="566" y="24" fill="#d9cbb4" font-size="12" text-anchor="start">Position</text>

  <!-- one row per moment: the axis, the rebased position between the offset and the camera -->
  <g stroke="#e9c27a" stroke-opacity=".3">
    <line x1="30" y1="60" x2="420" y2="60"/>
    <line x1="30" y1="98" x2="420" y2="98"/>
    <line x1="30" y1="136" x2="420" y2="136"/>
    <line x1="30" y1="174" x2="420" y2="174"/>
  </g>
  <g stroke="#a8834a" stroke-width="2.5">
    <line x1="30" y1="60" x2="147" y2="60"/>
    <line x1="160" y1="98" x2="173" y2="98"/>
    <line x1="290" y1="136" x2="368" y2="136"/>
    <line x1="290" y1="174" x2="199" y2="174"/>
  </g>
  <g fill="#e9c27a">
    <polygon points="30,54 36,60 30,66 24,60"/>
    <polygon points="160,92 166,98 160,104 154,98"/>
    <polygon points="290,130 296,136 290,142 284,136"/>
    <polygon points="290,168 296,174 290,180 284,174"/>
  </g>
  <g fill="#d9cbb4">
    <circle cx="147" cy="60" r="5"/>
    <circle cx="173" cy="98" r="5"/>
    <circle cx="368" cy="136" r="5"/>
    <circle cx="199" cy="174" r="5"/>
  </g>

  <g font-size="12" text-anchor="start" fill="#d9cbb4">
    <text x="444" y="64">at 900 <tspan fill="#8a7a63">→ offset 0</tspan></text>
    <text x="444" y="102">to 1100 <tspan fill="#8a7a63">→ offset 1000</tspan></text>
    <text x="444" y="140">to 2600 <tspan fill="#8a7a63">→ offset 2000</tspan></text>
    <text x="444" y="178">back to 1300 <tspan fill="#8a7a63">→ still 2000</tspan></text>
  </g>
</svg>
