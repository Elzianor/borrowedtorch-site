# Borrowed Torch apps, shown on the Downloads page.
# id: the card's anchor on the page (/downloads/#id)
# repo: the public repository the app's releases and guide are published to (its source stays private) - the Download,
#   Release notes and Guide links are built from it
# version: the release to offer. Bump it when a new release is out: the Download button fetches that release's file
# tag_prefix: what the release tags in repo start with, before the version (several apps share the repo)
# asset: the file the Download button fetches, {version} standing for the version
# guide: the folder in repo that holds the app's guide (its README)
# needs: short requirements line
# note: optional small print at the bottom of the card
- id: ormh-converter
  name: ORMH Converter
  repo: BorrowedTorchStudio/BorrowedTorch.Downloads
  version: v1.1.0
  tag_prefix: ormh-converter-
  asset: BorrowedTorch.OrmhConverter-{version}-win-x64.zip
  guide: OrmhConverter
  summary: Packs the ambient occlusion, roughness, metallic and height maps of a PBR material into one RGBA texture and saves it as a PNG — byte for byte what BorrowedTorch.ContentPipeline packs in a content build. Packs an albedo with its opacity, too.
  features:
    - One card per channel — an image, any of its channels, optionally inverted, or a constant — with a preview of every channel and of the packed result.
    - Albedo + opacity — the colour in RGB and the opacity in A, for a material that reads both from one texture.
    - Drop a texture pack's maps on the window and they are sorted into channels by name.
    - Opens .ormh descriptors, and packs them from the command line for batches.
  needs: 64-bit Windows · nothing to install, .NET included
  note: The exe isn't code-signed yet. If Windows SmartScreen stops it, choose More info, then Run anyway. Each release has a .sha256 file to check the download against.
- id: localization-helper
  name: Localization Helper
  repo: BorrowedTorchStudio/BorrowedTorch.Downloads
  version: v1.1.0
  tag_prefix: localization-helper-
  asset: BorrowedTorch.LocalizationHelper-{version}-win-x64.zip
  guide: LocalizationHelper
  summary: Keeps a game's translations in order — its languages, the folders and JSON files the texts are split into, the string IDs, and the text of every ID in every language.
  features:
    - One files structure, mirrored into every language's folder — add, rename, move or remove a file once and every language follows.
    - String IDs that belong to a file; adding, renaming, moving or removing one updates that file in every language.
    - The reference language's text above the one being written, and a mark on every language and ID that still lacks a text.
    - Plain JSON files the game reads without the app, safe to edit or merge outside it.
  needs: 64-bit Windows · nothing to install, .NET included
  note: The exe isn't code-signed yet. If Windows SmartScreen stops it, choose More info, then Run anyway. Each release has a .sha256 file to check the download against.
