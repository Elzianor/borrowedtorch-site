# Docs sidebar. Order here is the reading order (also drives Previous / Next links).
# To add an article: create docs/<name>.md, then add it to a group below.
- group: Getting started
  articles:
    - title: Overview
      url: /docs/
    - title: Installation
      url: /docs/installation/
    - title: Editor basics
      url: /docs/editor/

- group: Core
  articles:
    - title: Entities & components
      url: /docs/ecs/

# tree: true makes the group's title the root of a tree that opens on its pages. An article with glossary: names a
# data file whose entries (each with members) become its subitems: _data/ui_glossary.yml is generated with the
# glossary pages.
- group: UI
  tree: true
  articles:
    - title: Quick start guide
      url: /docs/ui/
    - title: Base element
      url: /docs/ui-base-element/
    - title: Layout elements
      url: /docs/ui-layout/
    - title: Controls
      url: /docs/ui-controls/
    - title: Lists and menus
      url: /docs/ui-lists/
    - title: Text
      url: /docs/ui-text/
    - title: Images and drawing
      url: /docs/ui-images/
    - title: Styles, bindings and animation
      url: /docs/ui-styles/
    - title: Glossary
      url: /docs/ui-glossary/
      glossary: ui_glossary

- group: Systems
  articles:
    - title: Camera
      url: /docs/camera/
    - title: Rendering & materials
      url: /docs/rendering/
