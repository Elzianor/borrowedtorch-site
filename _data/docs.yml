# Docs sidebar. Order here is the reading order (also drives Previous / Next links).
# To add an article: create docs/<name>.md, then add it to a group below.
- group: Getting started
  articles:
    - title: Overview
      url: /docs/
    - title: Installation
      url: /docs/installation/
    - title: Editor basics
      url: /docs/editor/

# tree: true makes the group's title the root of a tree that opens on its pages. An article with glossary: names a
# data file whose entries (each with members) become its subitems: _data/ecs_glossary.yml, _data/audio_glossary.yml,
# _data/ui_glossary.yml, _data/randomness_glossary.yml, _data/camera_glossary.yml,
# _data/transform_gizmo_glossary.yml, _data/scene_gizmo_glossary.yml, _data/shaping_functions_glossary.yml,
# _data/monoinput_glossary.yml, _data/input_binder_glossary.yml, _data/ray_tracing_glossary.yml and
# _data/frame_rate_counter_glossary.yml are generated with their glossary pages.
- group: ECS
  tree: true
  articles:
    - title: Quick start guide
      url: /docs/ecs/
    - title: Entities
