# Docs sidebar. Order here is the reading order (also drives Previous / Next links).
# To add an article: create docs/<name>.md, then add it to a group below.
- group: Getting started
  articles:
    - title: Overview
      url: /docs/
    - title: Installation
      url: /docs/installation/
    - title: Editor basics
      url: /docs/editor/

- group: Core
  articles:
    - title: Entities & components
      url: /docs/ecs/

# tree: true makes the group's title the root of a tree that opens on its pages. An article with glossary: names a
# data file whose entries (each with members) become its subitems: _data/audio_glossary.yml,
# _data/ui_glossary.yml and _data/randomness_glossary.yml are generated with their glossary pages.
- group: Audio
  tree: true
  articles:
    - title: Quick start guide
      url: /docs/audio/
    - title: Emitters
      url: /docs/audio-emitters/
    - title: Effect chains
      url: /docs/audio-effects/
    - title: Positional sound
      url: /docs/audio-positional/
    - title: Volume, tone and time
      url: /docs/audio-shaping/
    - title: Mixing, reverb and output
      url: /docs/audio-mixing/
    - title: Glossary
      url: /docs/audio-glossary/
      glossary: audio_glossary

